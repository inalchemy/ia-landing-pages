<title>Trust — Intentional Alchemy</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Josefin+Sans:wght@100;200;300&family=DM+Sans:wght@300;400&display=swap');
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;background:#0a0a0a;overflow:hidden;}

  #s1{
    position:fixed;inset:0;background:#0a0a0a;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    opacity:0;animation:fadeInUp 1.6s ease forwards 0.4s;z-index:10;
  }
  .logo-dark{width:clamp(80px,22vw,110px);margin-bottom:32px;filter:invert(1);opacity:0.92;}
  .affirmation{
    font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;
    font-size:clamp(20px,5.5vw,28px);line-height:1.75;color:#ffffff;
    text-align:center;padding:0 48px;
  }
  .product-tag{
    font-family:'DM Sans',sans-serif;font-weight:300;font-size:9px;
    letter-spacing:0.26em;text-transform:uppercase;color:rgba(255,255,255,0.2);
    margin-top:32px;
  }

  #s2{
    position:fixed;inset:0;background:#ffffff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;z-index:9;
  }
  .logo-light{width:clamp(70px,20vw,100px);margin-bottom:36px;}
  .cs-range{
    font-family:'DM Sans',sans-serif;font-weight:300;font-size:9px;
    letter-spacing:0.24em;text-transform:uppercase;color:#bbb;margin-bottom:12px;
  }
  .cs-name{
    font-family:'Josefin Sans',sans-serif;font-weight:200;
    font-size:clamp(32px,8vw,46px);color:#111;
    letter-spacing:0.18em;text-transform:uppercase;
    margin-bottom:20px;
  }
  .cs-rule{width:28px;height:1px;background:#e0e0e0;margin-bottom:20px;}
  .cs-message{
    font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;
    font-size:clamp(15px,4vw,18px);color:#aaa;text-align:center;
    padding:0 48px;line-height:1.8;margin-bottom:44px;
  }
  .cs-url{
    font-family:'DM Sans',sans-serif;font-weight:300;font-size:9px;
    letter-spacing:0.22em;text-transform:uppercase;color:#ccc;
  }

  @keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeOut{from{opacity:1;}to{opacity:0;}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .do-fade-out{animation:fadeOut 1.2s ease forwards!important;}
  .do-fade-in{animation:fadeIn 1.4s ease forwards!important;pointer-events:auto!important;}
</style>
